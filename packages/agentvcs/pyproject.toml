[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentvcs"
version = "0.3.0"
description = "Multidimensional version control for evolving agent fleets — code, goals, models and traces, with fluid↔crystallized state."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "EvolvingAgentsLabs" },
]
keywords = ["agents", "llm", "version-control", "vcs", "ai", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control",
]
dependencies = []  # zero runtime dependencies — stdlib only, auditable by anyone

# agentvcs is a directory of the evolving-agents monorepo, not its own repository.
# The standalone EvolvingAgentsLabs/agentvcs repo is the pre-monorepo ancestor and
# no longer receives commits; pointing PyPI at it would send every reader to a
# stale tree.
[project.urls]
Homepage = "https://github.com/EvolvingAgentsLabs/evolving-agents"
Source = "https://github.com/EvolvingAgentsLabs/evolving-agents/tree/main/packages/agentvcs"
Documentation = "https://github.com/EvolvingAgentsLabs/evolving-agents/tree/main/packages/agentvcs/docs"
Issues = "https://github.com/EvolvingAgentsLabs/evolving-agents/issues"

[project.scripts]
agentvcs = "agentvcs.cli:main"
avcs = "agentvcs.cli:main"
agentvcs-mcp = "agentvcs.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentvcs"]

# The dashboard's single-page app is a data file inside the package; force-include
# it so a packaging change can never ship `agentvcs ui` without its frontend.
[tool.hatch.build.targets.wheel.force-include]
"src/agentvcs/ui/index.html" = "agentvcs/ui/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
